<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Spendwise</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body id="signup-page-body">

    <header class="page-header">
        <a href="index.html" class="logo">SpendWise</a>
    </header>

    <main class="form-container">
        <h1>Sign Up</h1>
        <p class="form-subheading">Sign in to your Spendwise account</p>
        <form action="home.html" method="POST" class="main-form">
            <label for="fullname">Full Name</label>
            <input type="text" name="fullname" placeholder="Enter your full name" required>
            <label for="email">Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
            <label for="password">Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
            <label for="confirm_password">Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Confirm your password" required>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
        <p class="form-footer-text">
            Already have an account? <a href="login.html">Log In</a>
        </p>
    </main>

</body>
</html>
