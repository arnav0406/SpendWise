<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgets - Spendwise</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="app-layout">

    <main class="app-content">
        <div class="page-header-with-back">
            <a href="home.html" class="back-button">&larr;</a>
            <h1>Budgets</h1>
            <a href="#" class="btn-page-action">New Budget</a>
        </div>

        <div class="content-section">
            <h2>Current Budgets</h2>
            <table class="data-table card-style">
                <tbody>
                    <tr>
                        <td class="item-title">Groceries</td>
                        <td class="amount">₹200 / ₹500</td>
                    </tr>
                    <tr>
                        <td class="item-title">Entertainment</td>
                        <td class="amount">₹50 / ₹200</td>
                    </tr>
                    <tr>
                        <td class="item-title">Dining Out</td>
                        <td class="amount">₹100 / ₹300</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
